name: Replace source and build K-Clock Widgets

on:
  push:
    paths:
      - "K-clock-widgets.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        run: |
          mkdir -p /tmp/kclock
          unzip -q K-clock-widgets.zip -d /tmp/kclock
          SRC="$(find /tmp/kclock -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$SRC"
          echo "PROJECT_SOURCE=$SRC" >> "$GITHUB_ENV"

      - name: Replace old files
        run: |
          rsync -a --delete --exclude='.git' "$PROJECT_SOURCE/" ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Replace with K-Clock Widgets v2.1 [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: K-Clock-Widgets-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
