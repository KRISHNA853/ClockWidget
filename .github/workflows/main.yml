name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Find project (unzips an uploaded .zip if present)
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$Z" ]; then
            mkdir -p _proj && unzip -q "$Z" -d _proj
            S=$(find _proj -name settings.gradle | head -1)
            echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
          else
            echo "PROJ=." >> $GITHUB_ENV
          fi
      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ClockWidget-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
