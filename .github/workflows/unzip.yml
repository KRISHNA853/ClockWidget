name: Unzip Project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip into repo
        run: |
          Z=$(ls *.zip | head -1)
          rm -rf /tmp/proj && mkdir /tmp/proj
          unzip -q "$Z" -d /tmp/proj
          S=$(find /tmp/proj -name settings.gradle | head -1)
          SRC=$(dirname "$S")
          rm -rf app build.gradle settings.gradle gradle.properties
          rsync -a --exclude='.github' "$SRC"/ ./
          rm -f "$Z"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract project files from zip" || echo "nothing to commit"
          git push
