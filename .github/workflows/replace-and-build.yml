
name: K-Clock Widgets Build

on:
  workflow_dispatch:
  push:
    paths:
      - "K-clock-widgets.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract new K-Clock project
        run: |
          test -f K-clock-widgets.zip
          mkdir -p /tmp/project
          unzip -q K-clock-widgets.zip -d /tmp/project

          SRC=$(find /tmp/project -name settings.gradle -printf '%h\n' | head -1)
          test -n "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Replace old project files
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='K-clock-widgets.zip' \
            "$SRC/" ./

      - name: Commit updated project safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update K-Clock Widgets source [skip ci]"

            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"

            git rebase "origin/${GITHUB_REF_NAME}"

            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Clock-Widgets-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
